name: CD - Déploiement Automatique

on:
  workflow_run:
    workflows: ["CI - Tests HTML"]
    types: [completed]

jobs:
  # Cible 1 : GitHub Pages (Hébergement Public) [cite: 15]
  deploy-gh-pages:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4

  # Cible 2 : Serveur Linux Distant (Self-Hosted Runner) [cite: 17, 18]
  deploy-to-debian:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-gh-pages
    [cite_start]runs-on: self-hosted # C'est ici que votre VM Debian 13 intervient 
    steps:
      - uses: actions/checkout@v4
      - name: Mise à jour du serveur Nginx
        run: |
          # Copie vers le répertoire de production de Nginx 
          sudo cp index.html /var/www/html/index.html
          echo "Déploiement sur Runner Debian effectué."